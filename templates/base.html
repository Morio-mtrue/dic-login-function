{% load static %}

<html>

  <head>
    <meta charset="utf-8">
    <title>Task</title>
    <link rel="stylesheet" href="{% static 'tasks/css/normalize.css' %}">
    <link rel="stylesheet" href="{% static 'tasks/css/style.css' %}">
  </head>

  <body>
    <nav>
      <ul>
        {% if user.is_authenticated %}
          <li><a href="{% url 'tasks:index' %}">Task list</a></li>
          <li><a href="{% url 'accounts:detail' %}">Member Information</a></li>
          <li><a href="{% url 'accounts:logout' %}">Log out</a></li>
        {% else %}
          <li><a href="{% url 'accounts:signup' %}">Member Registration</a></li>
          <li><a href="{% url 'accounts:login' %}">Login</a></li>
        {% endif %}
      </ul>
    </nav>
    <main>
      <div>
        {% block main %}
        {% endblock %}
      </div>
    </main>
  </body>

</html>
