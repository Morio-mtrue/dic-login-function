{% extends 'base.html' %}

{% block main %}
  <h1>Password Change Page</h1>
  <form action="{% url 'accounts:password_change' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change</button>
  </form>
  <ul>
    <li><a href="{% url 'accounts:detail' %}">Return</a></li>
  </ul>
{% endblock %}
